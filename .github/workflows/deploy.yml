name: wxread

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: true    # 取消任何正在进行的相同并发组的工作流

on:
  # ===== 原 schedule 定时触发（当前 GitHub 端不触发，暂时停用，保留配置备用）=====
  # schedule:
  #   # 凌晨任务：北京时间每天 01:00（UTC 前一天 17:00）
  #   - cron: '0 17 * * *'
  #   # 早间任务：北京时间每天 05:00（UTC 前一天 21:00）
  #   #- cron: '0 21 * * *'
  #   # 午间任务：北京时间每天 11:40（UTC 03:40）
  #   #- cron: '40 3 * * *'
  #   # 晚间任务：北京时间每天 22:00（UTC 14:00）
  #   #- cron: '0 14 * * *'
  workflow_dispatch:  # 手动触发
    inputs:
      self_loop:
        description: '自动循环触发下一次（每 5 分钟一次，用于验证自动运行）'
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead  # 指定环境

    steps:

    - name: Set DNS to Google's DNS
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

    - name: Run deployment script
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        READ_NUM: "1"  # 测试模式：仅阅读 1 次（约 30 秒）；正常使用请改回 ${{ vars.READ_NUM }}

      run: |
        python main.py

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1

  # ===== 自动循环触发（替代 schedule）：每次成功后等 4 分钟，再触发下一次 workflow_dispatch =====
  # 等效每 5 分钟自动运行一次，不依赖 GitHub schedule 调度
  self-loop:
    name: Self-loop trigger (every 5 min)
    if: ${{ needs.deploy.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.self_loop == true }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Wait ~4 minutes
        run: sleep 240

      - name: Trigger next workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --ref main -f self_loop=true
